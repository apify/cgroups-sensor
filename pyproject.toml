[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "cgroups-sensor"
version = "0.1.0"
description = "Resource limits that actually apply to the running process, from cgroups or Windows job objects"
authors = [
    { name = "Apify Technologies s.r.o.", email = "support@apify.com" },
    { name = "Max Bohomolov"},
    { name = "Josef Procházka"},
    ]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
keywords = [
    "apify",
    "cgroups",
    "container",
    "cpu",
    "docker",
    "kubernetes",
    "limits",
    "memory",
    "windows",
]
dependencies = []

[project.urls]
"Apify Homepage" = "https://apify.com"
"Issue Tracker" = "https://github.com/apify/cgroups-sensor/issues"
"Source Code" = "https://github.com/apify/cgroups-sensor"

[dependency-groups]
dev = [
    "poethepoet<1.0.0",
    "pytest<10.0.0",
    "ruff~=0.16.0",
    "ty>=0.0.77,<0.1.0",
]

[tool.ruff]
line-length = 120
include = [
    "**/*.py",
    # Ruff formats Python code blocks embedded in Markdown files.
    "**/*.md",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Conflicts with the formatter
    "CPY001",  # Missing copyright notice at top of file
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D203",    # One blank line required before class docstring
    "D213",    # Multi-line docstring summary should start at the second line
    "D413",    # Missing blank line after last section
    "EM102",   # Exception must not use an f-string literal
    "ISC001",  # Conflicts with the formatter
    "TRY003",  # Avoid specifying long messages outside the exception class
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN401",  # Dynamically typed expressions are disallowed
    "D",       # Docstring style is relaxed in tests
    "PLR2004", # Magic value used in comparison
    "S101",    # Use of assert detected
    "S603",    # subprocess call: check for execution of untrusted input
    "S607",    # Starting a process with a partial executable path
    "SLF001",  # Private member accessed
    "T20",     # The e2e probe prints its result, that is its whole contract
]
"tests/e2e/scripts/*.py" = ["INP001"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.isort]
known-first-party = ["cgroups_sensor"]

[tool.pytest.ini_options]
addopts = "-r a --verbose --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "unified: needs the resource controllers on the cgroup v2 unified hierarchy; cgroup v1 lanes exclude it",
    "systemd_slices: needs the engine to place containers under systemd slices, not to drive cgroups itself",
    "kubernetes: needs kind and kubectl; only the kubernetes lane runs these",
    "podman: needs podman and a systemd user manager delegating cpu and memory; the lanes without it exclude it",
]
# The e2e readings carry a dozen fields, and a truncated one hides the number that explains the failure.
verbosity_assertions = 2

[tool.ty.environment]
python-version = "3.10"
python-platform = "all"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
unused-ignore-comment = "error"

# Run tasks with: uv run poe <task>
[tool.poe.tasks]
clean = "rm -rf .pytest_cache .ruff_cache build dist"
install-dev = "uv sync --group dev --locked"
build = "uv build --verbose"
type-check = "uv run ty check"
unit-tests = "uv run pytest tests/unit"
e2e-tests = "uv run pytest tests/e2e"
check-code = ["lint", "type-check", "unit-tests"]

[tool.poe.tasks.lint]
shell = "uv run ruff format --check && uv run ruff check"

[tool.poe.tasks.format]
shell = "uv run ruff check --fix && uv run ruff format"

[tool.uv.build-backend]
source-include = ["CHANGELOG.md"]
